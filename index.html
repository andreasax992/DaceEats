<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DACE EATS · Comida del mundo a domicilio</title>
  <meta name="description" content="DACE EATS: pide comida de todo el mundo. Recurso interactivo para un concierto didáctico.">
  <meta name="theme-color" content="#0E0F12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="logo" href="#/" aria-label="DACE EATS, inicio">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0E0F12"/><path d="M18 22h28l-3 22a4 4 0 0 1-4 3H25a4 4 0 0 1-4-3z" fill="#FF5A1F"/><path d="M25 22a7 7 0 0 1 14 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
        <span>DACE<b>EATS</b></span>
      </a>
      <div class="deliver" aria-label="Dirección de entrega">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span><small>Entregar en</small><strong>Escenario principal · Ahora</strong></span>
      </div>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Busca platos o países" aria-label="Buscar platos o países">
      </form>
      <button class="cart-btn" id="cartBtn" type="button" aria-label="Abrir pedido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
        <span class="cart-total" id="cartTotal">0,00 €</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <div class="wrap">DACE EATS · Recurso para concierto didáctico · Pedido de demostración: no se realizan pagos ni entregas reales.</div>
  </footer>

  <!-- Carrito -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true"></aside>

  <!-- Detalle de plato -->
  <div class="modal" id="dishModal" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!-- Pago -->
  <div class="pay-overlay" id="payOverlay" aria-hidden="true" role="status" aria-live="polite"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
